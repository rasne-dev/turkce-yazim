<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TürkçeYazım — Yazım Denetleyici</title>
<style>
  :root{
    --crimson:#B5202A;--crimson2:#8C1820;--ink:#1A1A2E;--slate:#4A4E69;
    --mist:#F7F5F2;--white:#FFF;--border:#E4E0DA;
    --red:#C0392B;--purp:#7C3AED;--warn:#B45309;--ambe:#D97706;--blue:#2563EB;
    --red-bg:rgba(192,57,43,.07);--pur-bg:rgba(124,58,237,.07);
    --war-bg:rgba(180,83,9,.07);--amb-bg:rgba(217,119,6,.08);--blu-bg:rgba(37,99,235,.07);
    --green:#15803D;--shadow:0 2px 16px rgba(0,0,0,.09);--r:10px;
    --f:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--f);background:var(--mist);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
  .hdr{background:var(--crimson);padding:0 2rem;height:60px;display:flex;align-items:center;gap:.85rem;box-shadow:0 2px 8px rgba(0,0,0,.2)}
  .seal{width:36px;height:36px;background:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:900;color:var(--crimson);flex-shrink:0}
  .bname{color:#fff;font-size:1.15rem;font-weight:700;line-height:1}
  .btag{color:rgba(255,255,255,.65);font-size:.68rem;margin-top:3px}
  .bdg{margin-left:auto;background:rgba(255,255,255,.18);color:#fff;font-size:.68rem;font-weight:600;padding:.22rem .55rem;border-radius:20px}
  .wrap{max-width:1060px;margin:0 auto;padding:1.5rem 1rem 3rem;width:100%;flex:1}
  .card{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:1.5rem;margin-bottom:1rem}
  .card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:.75rem}
  .lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--slate)}
  .smp{font-size:.75rem;color:var(--crimson);background:none;border:none;cursor:pointer;font-family:var(--f);font-weight:600;padding:0}
  .smp:hover{text-decoration:underline}
  textarea{width:100%;min-height:160px;border:2px solid var(--border);border-radius:8px;padding:1rem;font-size:1rem;line-height:1.75;font-family:var(--f);resize:vertical;color:var(--ink);transition:border-color .18s;background:var(--mist)}
  textarea:focus{outline:none;border-color:var(--crimson);background:#fff}
  textarea::placeholder{color:#B0A99F}
  .tlb{display:flex;align-items:center;gap:.65rem;margin-top:1rem;flex-wrap:wrap}
  .btn{padding:.52rem 1.2rem;border:none;border-radius:7px;font-size:.88rem;font-weight:600;cursor:pointer;font-family:var(--f);transition:background .15s,transform .1s;display:inline-flex;align-items:center;gap:.3rem}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn:disabled:active{transform:none}
  .draftNotice{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-size:.76rem;color:var(--slate);background:rgba(37,99,235,.06);border:1px solid rgba(37,99,235,.15);border-radius:7px;padding:.4rem .6rem;margin-bottom:.5rem}
  .draftNotice button{background:none;border:none;color:var(--slate);cursor:pointer;font-size:.8rem;padding:.1rem .3rem;line-height:1}
  .draftNotice button:hover{color:var(--ink)}
  .btn-p{background:var(--crimson);color:#fff}.btn-p:hover{background:var(--crimson2)}
  .btn-g{background:none;color:var(--slate);border:1.5px solid var(--border)}.btn-g:hover{border-color:var(--slate);color:var(--ink)}
  .btn-xs{padding:.35rem .75rem;font-size:.75rem;border-radius:6px}
  .cc{font-size:.78rem;color:var(--slate);opacity:.7;margin-left:.25rem}
  /* stats */
  .sbar{display:flex;align-items:center;gap:.85rem;background:#fff;border-radius:var(--r);padding:.7rem 1.25rem;box-shadow:var(--shadow);margin-bottom:.6rem;flex-wrap:wrap}
  .st{display:flex;align-items:center;gap:.38rem;font-size:.83rem;font-weight:600;cursor:pointer;padding:.2rem .45rem;border-radius:6px;border:1.5px solid transparent;transition:background .12s,border-color .12s}
  .st:hover{background:rgba(0,0,0,.035)}
  .st.active{background:rgba(0,0,0,.05);border-color:currentColor}
  .st:focus-visible{outline:2px solid var(--crimson);outline-offset:1px}
  .sd{width:8px;height:8px;border-radius:50%}
  .s-sp{color:var(--red)}.s-sp .sd{background:var(--red)}
  .s-gr{color:var(--purp)}.s-gr .sd{background:var(--purp)}
  .s-wn{color:var(--warn)}.s-wn .sd{background:var(--warn)}
  .s-pu{color:var(--ambe)}.s-pu .sd{background:var(--ambe)}
  .s-su{color:var(--blue)}.s-su .sd{background:var(--blue)}
  .sbar-r{margin-left:auto;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
  /* fix bar */
  .fbar{background:#fff;border-radius:var(--r);padding:.6rem 1.25rem;box-shadow:var(--shadow);margin-bottom:1rem;display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}
  .fbar-lbl{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--slate);margin-right:.2rem}
  /* results */
  .rgrid{display:grid;grid-template-columns:1fr 300px;gap:1rem;align-items:start}
  @media(max-width:720px){
    .rgrid{grid-template-columns:1fr}
    .scard{position:static;max-height:none;overflow-y:visible}
  }
  @media(max-width:480px){
    .hdr{padding:0 1rem}
    .btag,.bdg{display:none}
  }
  .ocard,.scard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:1.5rem}
  .scard{max-height:600px;overflow-y:auto;position:sticky;top:1rem;padding:1.25rem}
  .scard::-webkit-scrollbar{width:3px}
  .scard::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  .ctit{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--slate);padding-bottom:.85rem;margin-bottom:1rem;border-bottom:1px solid var(--border)}
  #otxt{font-size:1rem;line-height:1.85;white-space:pre-wrap;word-break:break-word}
  /* highlights */
  .h-sp,.h-gr,.h-wn,.h-pu,.h-su{cursor:pointer;border-radius:2px;padding:0 1px;text-decoration:underline;text-decoration-skip-ink:none}
  .h-sp:focus-visible,.h-gr:focus-visible,.h-wn:focus-visible,.h-pu:focus-visible,.h-su:focus-visible{outline:2px solid var(--crimson);outline-offset:1px}
  .ii:focus-visible{outline:2px solid var(--crimson);outline-offset:-1px}
  .h-sp{background:var(--red-bg);text-decoration-style:wavy;text-decoration-color:var(--red)}.h-sp:hover{background:rgba(192,57,43,.14)}
  .h-gr{background:var(--pur-bg);text-decoration-style:wavy;text-decoration-color:var(--purp)}.h-gr:hover{background:rgba(124,58,237,.13)}
  .h-wn{background:var(--war-bg);text-decoration-style:dotted;text-decoration-color:var(--warn)}.h-wn:hover{background:rgba(180,83,9,.13)}
  .h-pu{background:var(--amb-bg);text-decoration-style:wavy;text-decoration-color:var(--ambe)}.h-pu:hover{background:rgba(217,119,6,.15)}
  .h-su{background:var(--blu-bg);text-decoration-style:wavy;text-decoration-color:var(--blue)}.h-su:hover{background:rgba(37,99,235,.12)}
  /* sidebar items */
  .ii{border-radius:7px;padding:.55rem .7rem;margin-bottom:.4rem;cursor:pointer;transition:box-shadow .15s;border-left:3px solid transparent}
  .ii:hover{box-shadow:0 1px 6px rgba(0,0,0,.08)}
  .ii.spell{border-left-color:var(--red);background:var(--red-bg)}
  .ii.gram{border-left-color:var(--purp);background:var(--pur-bg)}
  .ii.warn{border-left-color:var(--warn);background:var(--war-bg)}
  .ii.punct{border-left-color:var(--ambe);background:var(--amb-bg)}
  .ii.suggest{border-left-color:var(--blue);background:var(--blu-bg)}
  .iw{font-weight:700;font-size:.86rem;margin-bottom:.1rem}
  .ii.spell .iw{color:var(--red)}.ii.gram .iw{color:var(--purp)}
  .ii.warn .iw{color:var(--warn)}.ii.punct .iw{color:var(--ambe)}.ii.suggest .iw{color:var(--blue)}
  .im{font-size:.73rem;color:var(--slate);line-height:1.3}
  .is{font-size:.72rem;color:var(--green);margin-top:.2rem;font-weight:600}
  /* ok card */
  .okcard{background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:3rem 2rem;text-align:center}
  /* popup */
  #pop{position:fixed;background:#fff;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.18);padding:1.1rem;width:268px;max-width:calc(100vw - 24px);z-index:9999;border:1px solid var(--border)}
  .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:.5rem}
  .pb{font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:.18rem .45rem;border-radius:4px}
  .pb.spell{background:var(--red-bg);color:var(--red)}.pb.gram{background:var(--pur-bg);color:var(--purp)}
  .pb.warn{background:var(--war-bg);color:var(--warn)}.pb.punct{background:var(--amb-bg);color:var(--ambe)}.pb.suggest{background:var(--blu-bg);color:var(--blue)}
  .pc{cursor:pointer;color:var(--slate);font-size:1.2rem;line-height:1;padding:2px 5px;border-radius:4px}.pc:hover{background:var(--mist)}
  .pw{font-size:1.02rem;font-weight:700;margin-bottom:.18rem}
  .pm{font-size:.76rem;color:var(--slate);line-height:1.35;margin-bottom:.6rem}
  .wbox{border-radius:7px;padding:.6rem .7rem;margin-bottom:.65rem;border:1px solid rgba(180,83,9,.2);background:rgba(180,83,9,.04)}
  .wbt{font-size:.66rem;font-weight:700;text-transform:uppercase;color:var(--warn);margin-bottom:.28rem}
  .wbr{font-size:.76rem;color:var(--ink);line-height:1.4;margin-bottom:.3rem}
  .wbe{font-size:.71rem;color:var(--slate);font-style:italic;line-height:1.35}
  .wgb{border-radius:7px;padding:.5rem .65rem;margin-bottom:.65rem;border:1px solid rgba(21,128,61,.25);background:rgba(21,128,61,.06);font-size:.74rem;color:var(--ink);line-height:1.4}
  .obGuess{border-color:var(--green);background:rgba(21,128,61,.05)}
  .ol{font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);margin-bottom:.32rem}
  .ob{display:flex;align-items:center;gap:.45rem;width:100%;text-align:left;padding:.4rem .55rem;border:1.5px solid var(--border);border-radius:7px;background:none;font-size:.83rem;cursor:pointer;color:var(--ink);font-family:var(--f);margin-bottom:.3rem;transition:border-color .12s,background .12s;font-weight:500}
  .ob:hover{border-color:var(--crimson);background:var(--mist)}
  .ob .oi{font-size:.95rem;flex-shrink:0}.ob .ot{line-height:1.2}
  .ob .os{font-size:.68rem;color:var(--slate);display:block;margin-top:.08rem}
  .sl{font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--slate);margin-bottom:.3rem}
  .sb{display:block;width:100%;text-align:left;padding:.38rem .55rem;border:none;border-radius:6px;background:none;font-size:.86rem;cursor:pointer;color:var(--ink);font-family:var(--f);transition:background .12s;font-weight:500}
  .sb:hover{background:var(--mist);color:var(--crimson);font-weight:700}
  .pf{margin-top:.7rem;padding-top:.6rem;border-top:1px solid var(--border)}
  .pa{font-size:.71rem;color:var(--slate);background:none;border:none;cursor:pointer;font-family:var(--f);padding:0;text-decoration:underline;text-underline-offset:2px}
  .pnav{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.6rem}
  .pnb{font-size:.72rem;font-weight:600;color:var(--ink);background:none;border:1px solid var(--border);border-radius:6px;padding:.28rem .55rem;cursor:pointer;font-family:var(--f)}
  .pnb:hover:not(:disabled){background:rgba(0,0,0,.04)}
  .pnb:disabled{opacity:.35;cursor:not-allowed}
  .pcnt{font-size:.7rem;color:var(--slate);font-weight:600}
  .pa:hover{color:var(--ink)}
</style>
</head>
<body>
<header class="hdr">
  <div class="seal">Tü</div>
  <div><div class="bname">TürkçeYazım</div><div class="btag">Yazım &amp; Dilbilgisi Denetleyici</div></div>
  <span class="bdg">TDK Uyumlu</span>
</header>

<div class="wrap">
  <div class="card">
    <div class="card-hd">
      <span class="lbl">Denetlenecek metin</span>
      <button class="smp" id="smpBtn">Örnek metin →</button>
    </div>
    <div id="draftNotice" class="draftNotice" style="display:none">
      💾 Önceki taslağınız geri yüklendi.
      <button type="button" id="draftDismiss" aria-label="Bildirimi kapat">✕</button>
    </div>
    <textarea id="inp" placeholder="Metni buraya yazın veya yapıştırın… (Ctrl+Enter: kontrol et)"></textarea>
    <div class="tlb">
      <button class="btn btn-p" id="chkBtn">✓ Kontrol Et</button>
      <button class="btn btn-g" id="clrBtn">✕ Temizle</button>
      <button class="btn btn-g" id="undoBtn" disabled title="Son işlemi geri al">↩ Geri Al</button>
      <span class="cc" id="cc">0 karakter · 0 kelime</span>
    </div>
  </div>

  <div id="statsBar" style="display:none">
    <div class="sbar">
      <div class="st s-sp" data-type="spell" tabindex="0" role="button" title="Sadece yazım hatalarını göster"><div class="sd"></div><span id="cSp">0</span> yazım</div>
      <div class="st s-gr" data-type="gram" tabindex="0" role="button" title="Sadece dilbilgisi hatalarını göster"><div class="sd"></div><span id="cGr">0</span> dilbilgisi</div>
      <div class="st s-wn" data-type="warn" tabindex="0" role="button" title="Sadece kontrol edilmesi gerekenleri göster"><div class="sd"></div><span id="cWn">0</span> kontrol et</div>
      <div class="st s-pu" data-type="punct" tabindex="0" role="button" title="Sadece noktalama hatalarını göster"><div class="sd"></div><span id="cPu">0</span> noktalama</div>
      <div class="st s-su" data-type="suggest" tabindex="0" role="button" title="Sadece önerileri göster"><div class="sd"></div><span id="cSu">0</span> öneri</div>
      <div class="st active" data-type="" style="color:var(--ink)" tabindex="0" role="button" title="Tümünü göster"><div class="sd" style="background:var(--ink)"></div><span id="cTo">0</span> toplam</div>
      <div class="sbar-r">
        <button class="btn btn-g btn-xs" id="cpyBtn">⎘ Kopyala</button>
      </div>
    </div>
    <div class="fbar">
      <span class="fbar-lbl">Düzelt:</span>
      <button class="btn btn-g btn-xs" id="fxAll" title="Tüm otomatik düzeltilebilir sorunları uygular">⚡ Tümünü</button>
      <button class="btn btn-g btn-xs" id="fxSp" title="Sadece yazım hatalarını düzeltir">🔴 Yazım</button>
      <button class="btn btn-g btn-xs" id="fxGr" title="Sadece dilbilgisi hatalarını düzeltir">🟣 Dilbilgisi</button>
      <button class="btn btn-g btn-xs" id="fxPu" title="Sadece noktalama hatalarını düzeltir">🟡 Noktalama</button>
      <button class="btn btn-g btn-xs" id="fxWarn" title="Kontrol Et olarak işaretlenenlerde en olası tahmini uygular">🔎 Tahminle (Kontrol Et)</button>
    </div>
  </div>

  <div id="res" style="display:none"></div>
</div>

<div id="pop" style="display:none" role="dialog" aria-modal="true" aria-labelledby="pw">
  <div class="ph"><span class="pb" id="pb"></span><span class="pc" id="pc" tabindex="0" role="button" aria-label="Kapat">×</span></div>
  <div class="pw" id="pw"></div>
  <div class="pm" id="pm"></div>
  <div id="pbody"></div>
  <div class="pf" id="pf"></div>
</div>

<script>
(function(){
'use strict';
function tl(s){return s.replace(/İ/g,'i').replace(/I/g,'ı').toLowerCase()}
function tu(s){if(!s)return s;const c=s[0];return(c==='i'?'İ':c==='ı'?'I':c.toUpperCase())+s.slice(1)}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function escAttr(v){return JSON.stringify(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

// Türkçe dahil kelime sınırı lookbehind/lookahead
const WB='(?<![\\wığüşöçİĞÜŞÖÇ\'\u2019\u02bc])';
const WE='(?![\\wığüşöçİĞÜŞÖÇ\'\u2019\u02bc])';
function wb(p){return WB+p+WE}

const ABBRS=new Set(['prof','dr','cad','sok','no','yard','doç','av','mah','alb','gen','müh','mim','ist','ank','m','sn','dk','sa','hz','bn','kd','uzm','arş','öğr','mr','mrs','st','vb','vs','bkz','krş','çev','haz','ed','yay','ünv','fak']);

// ============================================================
// SPELL — Yazım hataları (yüksek güvenirlikli kurallar)
// ============================================================
const SPELL=[
  // === BİTİŞİK / AYRI YAZIM ===
  ['birşey','bir şey'],['birşeyi','bir şeyi'],['birşeyler','bir şeyler'],
  ['birşeyde','bir şeyde'],['birşeyden','bir şeyden'],['birşeye','bir şeye'],
  ['herşey','her şey'],['herşeyi','her şeyi'],['herşeyleri','her şeyleri'],
  ['herşeyde','her şeyde'],['herşeyden','her şeyden'],['herşeye','her şeye'],
  ['hiçbirşey','hiçbir şey'],['hiçbirşeyi','hiçbir şeyi'],
  ['hiçbirşeyde','hiçbir şeyde'],['hiçbirşeyden','hiçbir şeyden'],
  ['bişey','bir şey'],['bişeyi','bir şeyi'],['bişeyler','bir şeyler'],
  ['yada','ya da'],
  ['bir çok','birçok'],['bir kaç','birkaç'],
  ['her hangi','herhangi'],
  ['bu gun','bugün'],['bu gün','bugün'],
  ['su an','şu an'],['su anda','şu anda'],['su anki','şu anki'],
  ['su ana','şu ana'],['su ana kadar','şu ana kadar'],
  ['altında ki','altındaki'],['üstünde ki','üstündeki'],
  ['yanında ki','yanındaki'],['içinde ki','içindeki'],
  ['dışında ki','dışındaki'],['başında ki','başındaki'],
  ['sonunda ki','sonundaki'],['arasında ki','arasındaki'],
  ['önünde ki','önündeki'],['arkasında ki','arkasındaki'],
  ['üzerinde ki','üzerindeki'],

  // === TÜRKÇE KARAKTER EKSİKLİĞİ ===
  // için ve türevleri
  ['icin','için'],['icine','içine'],['icinde','içinde'],['icinden','içinden'],
  ['icindeki','içindeki'],['iceri','içeri'],['iceride','içeride'],
  ['iceriden','içeriden'],['icerik','içerik'],['icerigi','içeriği'],

  // hiç, hiçbir
  ['hic','hiç'],['hicbir','hiçbir'],['hicbiri','hiçbiri'],['hicbirini','hiçbirini'],
  ['hic bir','hiçbir'],

  // gerçek ve türevleri
  ['gercek','gerçek'],['gercekten','gerçekten'],['gercegi','gerçeği'],
  ['gerceklestirilmesi','gerçekleştirilmesi'],['gerceklesen','gerçekleşen'],
  ['gerceklesme','gerçekleşme'],['gerceklestir','gerçekleştir'],

  // önce, özellikle, önemli ve türevleri
  ['once','önce'],['oncelikle','öncelikle'],['onceki','önceki'],
  ['onceden','önceden'],['oncesinde','öncesinde'],
  ['ozel','özel'],['ozellikle','özellikle'],['ozellikleri','özellikleri'],
  ['ozelligi','özelliği'],['ozelligini','özelliğini'],
  ['onem','önem'],['onemli','önemli'],['onemlidir','önemlidir'],
  ['oneminden','öneminden'],['onemsiz','önemsiz'],['onemli bir','önemli bir'],

  // özür ve türevleri
  ['ozur','özür'],['ozurlu','özürlü'],['ozur dilerim','özür dilerim'],

  // böyle, söyle, öyle
  ['boyle','böyle'],['boylece','böylece'],['boylelikle','böylelikle'],
  ['boyle bir','böyle bir'],
  ['soyle','söyle'],['soyleyin','söyleyin'],['soyledi','söyledi'],
  ['soyledim','söyledim'],['soylemek','söylemek'],['soylenir','söylenir'],
  ['oyle','öyle'],['oyleyse','öyleyse'],['oyle bir','öyle bir'],

  // yüzde, üzere
  ['yuzde','yüzde'],['uzere','üzere'],

  // birçok, birkaç
  ['bircok','birçok'],['birkac','birkaç'],

  // küçük, büyük
  ['kucuk','küçük'],['kucuktur','küçüktür'],
  ['buyuk','büyük'],['buyuktur','büyüktür'],

  // düşün ve türevleri
  ['dusun','düşün'],['dusunce','düşünce'],['dusunur','düşünür'],
  ['dusunmek','düşünmek'],['dusunuyorum','düşünüyorum'],['dusundum','düşündüm'],

  // güneş, ateş
  ['gunes','güneş'],['ates','ateş'],

// ============================================================
// TAHMİN YARDIMCILARI — "en olası" ayrı/bitişik tahmini için
// (Kesin kural değildir; sadece kullanıcıya ipucu olarak gösterilir,
//  karar her zaman kullanıcıya bırakılır.)
// ============================================================
const DATIVE_PRONOUNS=new Set(['bana','sana','ona','bize','size','onlara']);

// Fiilin verilen şahıs zamiriyle uyumlu çekimlenip çekimlenmediğine dair kaba bir tahmin.
function personAgrees(pron,verb){
  const v=tl(verb);
  const P1S=/(yorum|dım$|dim$|dum$|düm$|tım$|tim$|tum$|tüm$|mışım$|mişim$|muşum$|müşüm$|acağım$|eceğim$|sam$|sem$|malıyım$|meliyim$)/;
  const P2S=/(yorsun|dın$|din$|dun$|dün$|tın$|tin$|tun$|tün$|mışsın$|mişsin$|muşsun$|müşsün$|acaksın$|eceksin$|malısın$|melisin$)/;
  const P3S=/(yor$|dı$|di$|du$|dü$|tı$|ti$|tu$|tü$|mış$|miş$|muş$|müş$|acak$|ecek$|malı$|meli$)/;
  const P1P=/(yoruz|dık$|dik$|duk$|dük$|tık$|tik$|tuk$|tük$|mışız$|mişiz$|muşuz$|müşüz$|acağız$|eceğiz$|malıyız$|meliyiz$)/;
  const P2P=/(yorsunuz|dınız$|diniz$|dunuz$|dünüz$|tınız$|tiniz$|tunuz$|tünüz$|mışsınız$|mişsiniz$|muşsunuz$|müşsünüz$|acaksınız$|eceksiniz$|malısınız$|melisiniz$)/;
  const P3P=/(yorlar$|dılar$|diler$|dular$|düler$|tılar$|tiler$|tular$|tüler$|mışlar$|mişler$|muşlar$|müşler$|acaklar$|ecekler$)/;
  switch(pron){
    case'ben':return P1S.test(v);
    case'sen':return P2S.test(v);
    case'o':return P3S.test(v);
    case'biz':return P1P.test(v);
    case'siz':return P2P.test(v)||P2S.test(v);
    case'onlar':return P3P.test(v)||P3S.test(v); // 3. çoğulda fiil çekimsiz de kalabilir
    default:return false;
  }
}

// Zamir + "da/de" için en olası yorumu tahmin eder: 'A' (bağlaç) | 'B' (hâl eki) | null (belirsiz)
function guessDeDa(m,text){
  const pron=tl(m[1]);
  if(DATIVE_PRONOUNS.has(pron)){
    return{opt:'A',reason:'"'+m[1]+'" zaten yönelme hâlinde (-a/-e) olduğundan üzerine bir hâl eki daha almaz; bu yüzden "'+m[2]+'" burada neredeyse her zaman bağlaçtır.'};
  }
  const after=text.slice(m.index+m[0].length);
  // "var/yok" genelde cümlenin sonunda gelir (ör. "bende para var"), bu yüzden sadece
  // bir sonraki kelimeye değil, aynı cümle/tümce içindeki devamına bakıyoruz.
  const clause=(after.match(/^[^.!?\n]*/)||[''])[0];
  if(/(^|[^\wığüşöçİĞÜŞÖÇ])(var|yok)([^\wığüşöçİĞÜŞÖÇ]|$)/i.test(clause)){
    return{opt:'B',reason:'Aynı cümlede "var/yok" geçmesi, sahiplik/bulunma anlamı (hâl eki) olduğuna işaret eder: "'+m[0]+clause+'".'};
  }
  const nx=after.match(/^\s*([\wığüşöçİĞÜŞÖÇ]+)/);
  if(nx&&personAgrees(pron,nx[1])){
    return{opt:'A',reason:'Ardından gelen "'+nx[1]+'" fiili "'+m[1]+'" ile aynı şahısta çekimli görünüyor; bu da bağlaç kullanımına işaret eder: "'+m[1]+' '+m[2]+' '+nx[1]+'".'};
  }
  return null;
}

// Hâl eki + "ki" için en olası yorum: virgül yoksa çoğu örnekte sıfat eki (bitişik) doğru kullanımdır.
function guessKiHal(m,text){
  return{opt:'A',reason:'Virgülle ayrılmadığı için çoğunlukla sıfat eki (bitişik) kullanımıdır: "'+m[1]+'ki".'};
}

// "iste": çoğunlukla "işte" (bakınız/şuracıkta) demektir; ama "izin/yardım/af iste" gibi
// bir nesneden hemen sonra geliyorsa "istemek" fiilinin emir kipi olabilir.
function guessIste(m,text){
  const before=text.slice(Math.max(0,m.index-20),m.index);
  const pw=before.match(/([\wığüşöçİĞÜŞÖÇ]+)\s*$/);
  const prevWord=pw?tl(pw[1]):'';
  const ISTE_TRIGGERS=new Set(['izin','yardım','af','özür','borç','para','ders','söz','hak']);
  if(ISTE_TRIGGERS.has(prevWord)){
    return{opt:'B',reason:'Önünde "'+pw[1]+'" gibi bir nesne olması, burada "istemek" fiilinin emir kipi ("iste!") olabileceğine işaret eder.'};
  }
  return{opt:'A',reason:'"işte" (bakınız/şuracıkta anlamında) günlük yazıda çok daha sık kullanılır.'};
}

// "sadede": "sadede gelmek/girmek" deyiminde bitişik ve doğrudur; "de/da" bağlaç
// tekrarına işaret eden bir sıralama varsa ("sade de… X de…") ayrı bağlaç olabilir.
function guessSadede(m,text){
  const after=text.slice(m.index+m[0].length);
  const clause=(after.match(/^[^.!?\n]*/)||[''])[0];
  if(/\b(de|da)\b/i.test(clause)){
    return{opt:'A',reason:'Aynı cümlede tekrar "de/da" geçmesi ("sade de… X de…" gibi bir sıralama), bağlaç kullanımına işaret eder.'};
  }
  return{opt:'B',reason:'"sadede gelmek/girmek" (konunun özüne gelmek) deyiminde bu haliyle bitişik ve doğru kullanılır.'};
}

// "unlu": "unlu mamuller" gibi undan yapılan anlamında da kullanılan gerçek bir kelime;
// hemen ardından "mamul(ler)" gelmesi bu anlama işaret eder.
function guessUnlu(m,text){
  const after=text.slice(m.index+m[0].length,m.index+m[0].length+30);
  if(/^\s*mam/i.test(after)){
    return{opt:'B',reason:'Ardından "mamul/mamülleri" gelmesi "unlu mamuller" (undan yapılan ürünler) ifadesine işaret eder.'};
  }
  return{opt:'A',reason:'"ünlü" (meşhur anlamında) günlük yazıda çok daha sık kullanılır.'};
}

// "bir takım": spor/grup anlamındaki gerçek bir takımdan bahsediyorsa ayrı yazılır;
// çevredeki kelimeler buna işaret ediyorsa "bir takım" olarak bırakılması önerilir.
function guessBirTakim(m,text){
  const ctx=text.slice(Math.max(0,m.index-40),m.index+m[0].length+40);
  if(/\b(futbol|basketbol|voleybol|oyuncu|maç|lig|kurduk|kurdu|oluşturduk|oluşturdu|kaptan)\b/i.test(ctx)){
    return{opt:'B',reason:'Çevredeki kelimeler (takım kurmak/futbol vb.) "bir takım"ın gerçek bir grup/ekip anlamında kullanıldığına işaret ediyor.'};
  }
  return{opt:'A',reason:'"birtakım" (bazı/çeşitli anlamında) yazıda çok daha sık kullanılan bitişik biçimdir.'};
}

// WARNS — Bağlama göre değişen (kullanıcı kararı gereken)
// ============================================================

    guess:guessDeDa,
    makeOpts:m=>({
      A:{label:'Bağlaç — ayrı yaz',sub:'"'+m[1]+' '+m[2]+'"',val:m[1]+' '+m[2]},
      B:{label:'Hâl eki — olduğu gibi bırak',sub:'"'+m[0]+'" bu haliyle doğru',val:null},
    })

  {
    // masada ki, evde ki vb. — hal eki + ki

    preCheck:(txt,m)=>{
      // Virgülle ayrılmış "masada, ki bu önemli" → bağlaç, doğru kullanım
      const pre=txt.slice(Math.max(0,m.index-3),m.index).trim();
      return !pre.endsWith(',')&&!pre.endsWith(';');
    },
    rule:'Hâl eki + "ki"',
    detail:'SIFAT EKİ (bitişik): "masadaki kitap" ✓\nBĞLAÇ (virgülle ayrı): "masada, ki bu önemli" ✓',
    guess:guessKiHal,
    makeOpts:m=>({
      A:{label:'Sıfat eki — bitişik yaz',sub:'"'+m[1]+'ki"',val:m[1]+'ki'},
      B:{label:'Bağlaç — ayrı bırak',sub:'Gerekirse önüne virgül koy',val:null},
    })
  },
  {
    rx:new RegExp(WB+'iste'+WE,'gi'),
    rule:'"iste" mi, "işte" mi?',
    detail:'İŞTE (bakınız/şuracıkta): "işte orada" ✓\nEMİR KİPİ (istemek fiili): "ondan izin iste" ✓',
    guess:guessIste,
    makeOpts:m=>({
      A:{label:'"işte" — değiştir',sub:'bakınız/şuracıkta anlamı',val:'işte'},
      B:{label:'"iste" — olduğu gibi bırak',sub:'istemek fiilinin emir kipi',val:null},
    })
  },
  {
    rx:new RegExp(WB+'sadede'+WE,'gi'),
    rule:'"sadede" mi, "sade de" mi?',
    detail:'DEYİM (bitişik): "sadede gelmek/girmek" ✓\nBĞLAÇ (ayrı): "kahve sade de olur, şekerli de" ✓',
    guess:guessSadede,
    makeOpts:m=>({
      A:{label:'"sade de" — ayrı yaz',sub:'bağlaç kullanımı',val:'sade de'},
      B:{label:'"sadede" — olduğu gibi bırak',sub:'"sadede gelmek/girmek" deyimi',val:null},
    })
  },
  {
    rx:new RegExp(WB+'unlu'+WE,'gi'),
    rule:'"unlu" mu, "ünlü" mü?',
    detail:'GERÇEK KELİME (undan yapılan): "unlu mamuller" ✓\nYANLIŞ YAZIM (meşhur anlamında): "ünlü sanatçı" ✓',
    guess:guessUnlu,
    makeOpts:m=>({
      A:{label:'"ünlü" — değiştir',sub:'meşhur anlamı',val:'ünlü'},
      B:{label:'"unlu" — olduğu gibi bırak',sub:'undan yapılan anlamı',val:null},
    })
  },
  {
    rx:new RegExp(WB+'bir'+WE+'\\s+'+WB+'takım'+WE,'gi'),
    rule:'"bir takım" mı, "birtakım" mı?',
    detail:'GERÇEK GRUP (ayrı): "bir takım kurduk" ✓\nBAZI/ÇEŞİTLİ (bitişik): "birtakım sorunlar" ✓',
    guess:guessBirTakim,
    makeOpts:m=>({
      A:{label:'"birtakım" — bitişik yaz',sub:'bazı/çeşitli anlamı',val:'birtakım'},
      B:{label:'"bir takım" — olduğu gibi bırak',sub:'gerçek bir grup/ekip anlamı',val:null},
    })
  },
];



function getLastVowel(w){const v=w.match(/[aeıioöuü]/gi);return v?v[v.length-1].toLowerCase():null}
function vowelHarmony(v1,v2){const tk='aıou',tn='eiöü';return(tk.includes(v1)&&tk.includes(v2))||(tn.includes(v1)&&tn.includes(v2))}

// ============================================================
// ANALİZ FONKSİYONU
// ============================================================
function analyze(text){
  const issues=[],ranges=[];
  // JS'in yerleşik /i bayrağı Türkçe büyük İ/I harflerini doğru küçültmediği için
  // (İçin, Şimdi gibi cümle başı kelimeler kaçırılıyordu), kendi normalize fonksiyonumuzla
  // eşleştirme yapıp orijinal metindeki karşılığını gösteriyoruz.
  const ltext=tl(text);
  function ok(s,e){return!ranges.some(r=>s<r[1]&&e>r[0])}
  function push(iss){
    if(ok(iss.start,iss.end)){
      // Öneri büyük harfle başlayan orijinale uymalı
      if(iss.suggestions&&iss.suggestions.length){
        iss.suggestions=iss.suggestions.map(sug=>{
          const fc=iss.word[0];
          if(fc&&fc===fc.toUpperCase()&&fc!==fc.toLowerCase()){
            return tu(sug);
          }
          return sug;
        });
      }
      issues.push(iss);
      ranges.push([iss.start,iss.end]);
    }
  }

  // 1. Yazım hataları
  for(const[w,r] of SPELL){
    try{
      const rx=new RegExp(wb(tl(w)),'g');let m;
      while((m=rx.exec(ltext))!==null)
        push({type:'spell',word:text.slice(m.index,m.index+m[0].length),start:m.index,end:m.index+m[0].length,
          suggestions:[r],msg:'"'+w+'" yerine "'+r+'" yazılmalıdır'});
    }catch(e){}
  }

  // 2. Dilbilgisi hataları (de/da ve ki)
  for(const[w,r] of [...DEDA,...KI]){
    try{
      const rx=new RegExp(wb(tl(w)),'g');let m;
      while((m=rx.exec(ltext))!==null)
        push({type:'gram',word:text.slice(m.index,m.index+m[0].length),start:m.index,end:m.index+m[0].length,
          suggestions:[r],msg:'TDK: "'+w+'" → "'+r+'"'});
    }catch(e){}
  }

  // 2b. Mİ soru eki ve fiil eki + "ki" bağlacı (büyük harf/nokta önerileriyle
  //     aynı konumda çakışıp elenmesinler diye erkenden, punct/suggest'ten önce çalışır)
  {
    const MI_EXC=new Set(['cami','gemi','resmi','azami','umumi','ilmi','harimi','mermi','hami','sami','nami','rumi','pazı','sızı','yazı','dizi','bazı','yani','peki','belki','sanki','bari','hani','üniversite','siyasi','askeri','milli','beni','seni','onu','bizi','sizi','onları']);
    // NOT: JS'nin yerleşik \b sınırı yalnızca [A-Za-z0-9_] karakterlerini "kelime karakteri" sayar.
    // Bu yüzden ı/ğ/ü/ş/ö/ç harflerinden hemen sonra \b kullanmak YANLIŞ kelime sınırları üretir
    // (ör. "kalmıyor" kelimesinde "mı"dan sonraki "yor" kısmı \b'yi tetikleyip "kalmı" + "yor" gibi
    // hatalı bölünmelere, dolayısıyla "kal mıyor" gibi yanlış önerilere yol açıyordu).
    // Bunun yerine dosyanın başında tanımlı, Türkçe harfleri de tanıyan WE (word-end) ileri-bakış
    // ifadesini kullanıyoruz.
    const miRx=new RegExp('([\\wığüşöçİĞÜŞÖÇ]+)(mı|mi|mu|mü)(sın|sin|sun|sün|m|ız|iz|uz|üz|nız|niz|nuz|nüz|lar|ler)?'+WE,'gi');
    let mm;
    while((mm=miRx.exec(text))!==null){
      const base=mm[1],part=mm[2],suf=mm[3]||'';
      const full=tl(base+part);
      if(MI_EXC.has(full)||MI_EXC.has(tl(base))||base.length<=1) continue;
      const lv=getLastVowel(base);
      if(!lv) continue;
      const correct=('aıou'.includes(lv)&&(part==='mı'||part==='mu'))||('eiöü'.includes(lv)&&(part==='mi'||part==='mü'));
      if(!correct) continue;
      push({type:'gram',word:mm[0],start:mm.index,end:mm.index+mm[0].length,
        suggestions:[base+' '+part+suf],msg:'Soru eki "'+part+'" fiilden ayrı yazılır'});
    }

    const KI_OK=new Set(['sanki','oysaki','mademki','belki','halbuki','meğerki','illaki','oysakide','belkide','çünkü']);
    // Aynı \b sorunu burada da olabileceği için Türkçe harfleri tanıyan WB/WE kullanılıyor.
    const kiRx=new RegExp(WB+'([\\wığüşöçİĞÜŞÖÇ]{3,})(ki)'+WE,'gi');
    while((mm=kiRx.exec(text))!==null){
      const base=mm[1];
      if(KI_OK.has(tl(mm[0]))||KI_OK.has(tl(base))) continue;
      if(/dik$|yor$|acak$|ecek$|miş$|mış$|muş$|müş$|malı$|meli$|sa$|se$|sun$|sin$|lar$|ler$|dı$|di$|du$|dü$|tı$|ti$|tu$|tü$/.test(tl(base))){
        push({type:'gram',word:mm[0],start:mm.index,end:mm.index+mm[0].length,
          suggestions:[base+' '+mm[2]],msg:'Bağlaç olan "ki" fiilden ayrı yazılır'});
      }
    }
  }

  // 3. Uyarı gerektiren durumlar (kullanıcı karar verir)
  for(const wp of WARNS){
    const rx=new RegExp(wp.rx.source,'gi');let m;
    while((m=rx.exec(text))!==null){
      if(!ok(m.index,m.index+m[0].length)) continue;
      if(wp.preCheck&&!wp.preCheck(text,m)) continue;
      const opts=wp.makeOpts(m);
      const guess=wp.guess?wp.guess(m,text):null;
      push({type:'warn',word:m[0],start:m.index,end:m.index+m[0].length,
        suggestions:opts.A.val?[opts.A.val]:[],
        optA:opts.A,optB:opts.B,rule:wp.rule,detail:wp.detail,guess:guess,
        msg:'Bağlama göre değişir — kontrol edin'});
    }
  }

  // 4. Noktalama
  let m;
  // Virgülden sonra boşluk yok
  const r1=/,(?=[^ \n\r"'»)\].,;!?\u2019\d])/g;
  while((m=r1.exec(text))!==null)
    push({type:'punct',word:',',start:m.index,end:m.index+1,
      suggestions:[', '],msg:'Virgülden sonra boşluk bırakılmalıdır'});

  // Noktadan sonra boşluk yok
  const r2=/\.(?=[A-ZİĞÜŞÖÇa-zığüşöç])/g;
  while((m=r2.exec(text))!==null){
    const prevChar=text[m.index-1];
    const nextChar=text[m.index+1];
    if(/\d/.test(prevChar)&&/\d/.test(nextChar)) continue;
    const prevWord=text.slice(0,m.index).match(/[\wığüşöçİĞÜŞÖÇ]+$/);
    if(prevWord&&ABBRS.has(tl(prevWord[0]))) continue;
    push({type:'punct',word:'.',start:m.index,end:m.index+1,
      suggestions:['. '],msg:'Noktadan sonra boşluk bırakılmalıdır'});
  }

  // Soru/ünlem sonrası boşluk yok
  const r3=/[?!](?=[A-ZİĞÜŞÖÇa-zığüşöç])/g;
  while((m=r3.exec(text))!==null)
    push({type:'punct',word:text[m.index],start:m.index,end:m.index+1,
      suggestions:[text[m.index]+' '],msg:'Noktalama işaretinden sonra boşluk bırakılmalıdır'});

  // Noktalama önünde boşluk var
  const r4=/[ \t]+([,;:.!?])/g;
  while((m=r4.exec(text))!==null)
    push({type:'punct',word:m[0],start:m.index,end:m.index+m[0].length,
      suggestions:[m[1]],msg:'Noktalama işaretinden önce boşluk olmamalıdır'});

  // Çift boşluk
  const r5=/[^\S\n]{2,}/g;
  while((m=r5.exec(text))!==null)
    push({type:'punct',word:m[0],start:m.index,end:m.index+m[0].length,
      suggestions:[' '],msg:'Gereksiz fazla boşluk'});

  // 5. Öneriler
  // Üç nokta → elipsis
  const r6=/\.{3}/g;
  while((m=r6.exec(text))!==null)
    push({type:'suggest',word:'...',start:m.index,end:m.index+3,
      suggestions:['…'],msg:'Üç nokta yerine "…" (elipsis) kullanılabilir'});

  // Cümle başı büyük harf
  // NOT: Bir cümle "merhaba..." yerine "(merhaba...", "\"merhaba...", "-merhaba..."
  // gibi açılış tırnağı/parantez/tire ile başlıyorsa, bu karakterler eskiden ss
  // (cümle-başı) bayrağını erkenden sıfırlıyor ve asıl ilk harfe hiç ulaşılamadan
  // büyük harf kontrolü devre dışı kalıyordu. Bu karakterleri, tam da bir cümle
  // başlangıcındayken, boşluk gibi "şeffaf" sayıyoruz.
  const OPEN_TRANSPARENT=/["'“‘«\(\[\{\-–—]/;
  let ss=true;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(ss&&/[a-zığüşöç]/.test(c)){
      const u=tu(c);
      if(u!==c&&ok(i,i+1)){
        let isStart=true;
        let lb=i-1;
        while(lb>=0&&(/\s/.test(text[lb])||OPEN_TRANSPARENT.test(text[lb]))) lb--;
        if(lb>=0&&text[lb]==='.'){
          const pw=text.slice(0,lb).match(/[\wığüşöçİĞÜŞÖÇ]+$/);
          if(pw&&ABBRS.has(tl(pw[0]))) isStart=false;
          if(/\d/.test(text[lb-1])&&/\d/.test(c)) isStart=false;
        }
        // İki nokta üst üste sonrası büyük harf zorunlu değil
        if(lb>=0&&text[lb]===':') isStart=false;
        if(isStart) push({type:'suggest',word:c,start:i,end:i+1,
          suggestions:[u],msg:'Cümle başı büyük harfle yazılmalıdır'});
      }
      ss=false;
    } else if(/[.!?]/.test(c)){
      let isEnd=true;
      if(c==='.'){
        const pw=text.slice(0,i).match(/[\wığüşöçİĞÜŞÖÇ]+$/);
        if(pw&&ABBRS.has(tl(pw[0]))) isEnd=false;
        if(/\d/.test(text[i-1])&&/\d/.test(text[i+1])) isEnd=false;
      }
      if(isEnd) ss=true;
    } else if(!/\s/.test(c)){
      if(!(ss&&OPEN_TRANSPARENT.test(c))) ss=false;
    }
  }

  // Kısaltma/sayı + ek → kesme işareti
  // (Aynı \b sorunu: "yı", "yü" gibi Türkçe harfle biten eklerden sonra WE kullanıyoruz.)
  const r7=new RegExp('([A-ZİĞÜŞÖÇ]{2,}|\\d+)(nın|nin|nun|nün|nda|nde|ndan|nden|ya|ye|yı|yi|yu|yü|yla|yle|da|de|ta|te|dan|den|tan|ten|ın|in|un|ün|n|m)'+WE,'g');
  while((m=r7.exec(text))!==null){
    const prev=m.index>0?text[m.index-1]:null;
    if(prev==="'"||prev==='\u2019') continue;
    if(!ok(m.index,m.index+m[0].length)) continue;
    push({type:'suggest',word:m[0],start:m.index,end:m.index+m[0].length,
      suggestions:[m[1]+"'"+m[2]],
      msg:(/^\d+$/.test(m[1])?'Sayı':'Kısaltma')+' ekinden önce kesme işareti gereklidir'});
  }

  // Cümle sonu noktalama eksik
  {
    const trimmed=text.replace(/\s+$/,'');
    let endPos=trimmed.length;
    while(endPos>0&&/[)\]"'»"'\u2019]/.test(trimmed[endPos-1])) endPos--;
    const lastCh=trimmed[endPos-1];
    if(lastCh&&/[\wığüşöçİĞÜŞÖÇ]/.test(lastCh)&&ok(endPos-1,endPos)){
      push({type:'punct',word:lastCh,start:endPos-1,end:endPos,
        suggestions:[lastCh+'.',lastCh+'!',lastCh+'?'],
        msg:'Metin bir noktalama işaretiyle bitmelidir (., !, ?)'});
    }
  }

  issues.sort((a,b)=>a.start-b.start);
  return issues;
}

// DURUM & RENDER
// ============================================================
let curText='',curIssues=[],displayedIssues=[],activeFilter=null;
const ignored=new Set();
const HC={spell:'h-sp',gram:'h-gr',warn:'h-wn',punct:'h-pu',suggest:'h-su'};
const LBL={spell:'Yazım Hatası',gram:'Dilbilgisi',warn:'Kontrol Edin',punct:'Noktalama',suggest:'Öneri'};

// Karakter + kelime sayacı metnini üretir (ör. "142 karakter · 23 kelime").
function countLabel(t){
  const chars=t.length;
  const words=t.trim()?(t.trim().match(/[\wığüşöçİĞÜŞÖÇ]+/g)||[]).length:0;
  return chars.toLocaleString('tr-TR')+' karakter · '+words.toLocaleString('tr-TR')+' kelime';
}

// Metin kutusunu (textarea değeri, boy, sayaç, taslak kaydı) tek yerden güncelleyen
// ortak yardımcı. Önceden fixByType/fixWarnByGuess/TY.fix bu adımları atlıyor,
// bu yüzden düzeltme sonrası kutu boyu ayarlanmıyor ve taslak kaydedilmiyordu.
function setEditorText(t){
  curText=t;
  const el=document.getElementById('inp');
  el.value=t;
  autoResize.call(el);
  document.getElementById('cc').textContent=countLabel(t);
  try{localStorage.setItem('ty_draft',t);}catch(e){}
}

// ---- Geri Al (Undo) ----
// Metni veya yoksayılanlar listesini değiştiren her işlemden önce anlık bir
// kopya (snapshot) tutuyoruz; "↩ Geri Al" butonu bu kopyaları LIFO sırayla geri yükler.
const undoStack=[];
function snapshotUndo(){
  undoStack.push({text:curText,ignored:new Set(ignored)});
  if(undoStack.length>50) undoStack.shift();
  const b=document.getElementById('undoBtn');if(b)b.disabled=false;
}
function undo(){
  const st=undoStack.pop();
  if(!st) return;
  ignored.clear();
  for(const v of st.ignored) ignored.add(v);
  setEditorText(st.text);
  closePop();run();
  if(!undoStack.length){const b=document.getElementById('undoBtn');if(b)b.disabled=true;}
}

function renderOut(text,issues){
  let html='',pos=0;
  for(let i=0;i<issues.length;i++){
    const iss=issues[i];
    html+=esc(text.slice(pos,iss.start)).replace(/\n/g,'<br>');
    html+=`<span class="${HC[iss.type]}" tabindex="0" role="button" aria-label="${esc(LBL[iss.type])}: ${esc(iss.word.trim()||'boşluk')}" onclick="TY.pop(event,${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();TY.pop(event,${i})}">${esc(iss.word)||'&nbsp;&nbsp;'}</span>`;
    pos=iss.end;
  }
  return html+esc(text.slice(pos)).replace(/\n/g,'<br>');
}

function renderSide(issues){
  return issues.map((iss,i)=>{
    const w=iss.word.trim()||'(boşluk)';
    const s=iss.suggestions[0]?`<div class="is">→ ${esc(iss.suggestions[0])}</div>`:'';
    return`<div class="ii ${iss.type}" tabindex="0" role="button" aria-label="${esc(LBL[iss.type])}: ${esc(w)} — ${esc(iss.msg)}" onclick="TY.pop(null,${i})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();TY.pop(null,${i})}">
      <div class="iw">${esc(w)}</div><div class="im">${esc(iss.msg)}</div>${s}</div>`;
  }).join('');
}

function renderRes(issues,isFiltered){
  if(!issues.length){
    if(isFiltered) return`<div class="okcard">
      <div style="font-size:2.5rem;margin-bottom:.75rem">🔍</div>
      <div style="font-size:1.1rem;font-weight:700;color:var(--ink)">Bu türde hata yok.</div>
      <div style="color:var(--slate);font-size:.85rem;margin-top:.4rem">Diğer hataları görmek için "toplam"a tıklayarak filtreyi kaldırın.</div>
    </div>`;
    return`<div class="okcard">
    <div style="font-size:2.5rem;margin-bottom:.75rem">✅</div>
    <div style="font-size:1.1rem;font-weight:700;color:var(--green)">Harika! Hata bulunamadı.</div>
    <div style="color:var(--slate);font-size:.85rem;margin-top:.4rem">Metninizde tespit edilebilen bir sorun yok.</div>
  </div>`;
  }
  return`<div class="rgrid">
    <div class="ocard"><div class="ctit">Denetlenen Metin</div><div id="otxt">${renderOut(curText,issues)}</div></div>
    <div class="scard"><div class="ctit">Hatalar &amp; Öneriler (${issues.length})</div><div id="slist">${renderSide(issues)}</div></div>
  </div>`;
}

window.TY={
  pop(ev,idx){
    if(ev) ev.stopPropagation();
    if(!TY.render(idx)) return;
    const pop=document.getElementById('pop');
    pop.style.display='block';pop.style.transform='';
    // NOT: Klavye ile (Enter/Boşluk) açılan popup'larda 'ev' bir KeyboardEvent'tir ve
    // clientX/clientY TANIMSIZDIR (fare olayları gibi koordinat taşımaz). Bunu fark
    // etmeden ev.clientX kullanmak popup'ı "NaNpx" gibi geçersiz bir konuma
    // gönderiyordu. Klavye tetiklemelerinde odaklanılan elemanın konumunu kullanıyoruz.
    const isMouse=ev&&typeof ev.clientX==='number'&&(ev.clientX!==0||ev.clientY!==0||ev.type.startsWith('click')||ev.type.startsWith('mouse'));
    if(isMouse){
      let x=ev.clientX+10,y=ev.clientY+14;
      if(x+276>window.innerWidth) x=ev.clientX-284;
      if(y+360>window.innerHeight) y=ev.clientY-370;
      pop.style.left=Math.max(4,x)+'px';pop.style.top=Math.max(4,y)+'px';
    } else if(ev&&ev.target&&ev.target.getBoundingClientRect){
      const r=ev.target.getBoundingClientRect();
      let x=r.left,y=r.bottom+8;
      if(x+276>window.innerWidth) x=r.right-276;
      if(y+360>window.innerHeight) y=Math.max(4,r.top-368);
      pop.style.left=Math.max(4,x)+'px';pop.style.top=Math.max(4,y)+'px';
    } else {pop.style.left='50%';pop.style.top='40%';pop.style.transform='translate(-50%,-50%)';}
    lastFocused=(ev&&ev.target)||document.activeElement;
    document.getElementById('pc').focus();
  },
  // Popup içeriğini (konumunu DEĞİŞTİRMEDEN) çizer; hem ilk açılışta hem de
  // "Sonraki/Önceki" ile gezinirken kullanılır. Başarılıysa true, geçersiz idx'te false döner.
  render(idx){
    const iss=displayedIssues[idx];if(!iss)return false;
    curPopIdx=idx;
    const p=document.getElementById('pb');p.textContent=LBL[iss.type];p.className='pb '+iss.type;
    document.getElementById('pw').textContent=iss.word.trim()||'(boşluk)';
    document.getElementById('pm').textContent=iss.msg;
    const body=document.getElementById('pbody');
    if(iss.type==='warn'){
      const g=iss.guess;
      const guessBox=g?`<div class="wgb">🔎 <b>En olası:</b> ${esc(g.opt==='A'?iss.optA.label:iss.optB.label)} — ${esc(g.reason)}</div>`:'';
      body.innerHTML=`<div class="wbox">
        <div class="wbt">📌 ${esc(iss.rule)}</div>
        <div class="wbr">${esc(iss.detail).replace(/\n/g,'<br>')}</div>
      </div>
      ${guessBox}
      <div class="ol">Ne yapmak istersiniz?</div>
      ${iss.optA.val?`<button class="ob${g&&g.opt==='A'?' obGuess':''}" onclick="TY.fix(${idx},${escAttr(iss.optA.val)})"><span class="oi">✏️</span><span class="ot">${esc(iss.optA.label)}${g&&g.opt==='A'?' ⭐':''}<span class="os">${esc(iss.optA.sub||'')}</span></span></button>`:''}
      <button class="ob${g&&g.opt==='B'?' obGuess':''}" onclick="TY.ign(${escAttr(iss.word)},${escAttr(iss.type)})"><span class="oi">✓</span><span class="ot">${esc(iss.optB.label)}${g&&g.opt==='B'?' ⭐':''}<span class="os">${esc(iss.optB.sub||'')}</span></span></button>`;
    } else if(iss.suggestions.length){
      body.innerHTML='<div class="sl">Öneriler</div>'+
        iss.suggestions.map(s=>`<button class="sb" onclick="TY.fix(${idx},${escAttr(s)})">${esc(s)}</button>`).join('');
    } else { body.innerHTML='<div style="font-size:.76rem;color:var(--slate);font-style:italic">Öneri bulunamadı</div>'; }
    const ft=document.getElementById('pf');ft.innerHTML='';
    if(iss.type!=='warn'){const b=document.createElement('button');b.className='pa';b.textContent='Yoksay';b.onclick=()=>TY.ign(iss.word,iss.type);ft.appendChild(b);}
    if(displayedIssues.length>1){
      const nav=document.createElement('div');nav.className='pnav';
      const prevB=document.createElement('button');prevB.className='pnb';prevB.textContent='‹ Önceki';
      prevB.disabled=idx<=0;prevB.onclick=(ev2)=>{ev2.stopPropagation();TY.nav(-1);};
      const cnt=document.createElement('span');cnt.className='pcnt';cnt.textContent=(idx+1)+' / '+displayedIssues.length;
      const nextB=document.createElement('button');nextB.className='pnb';nextB.textContent='Sonraki ›';
      nextB.disabled=idx>=displayedIssues.length-1;nextB.onclick=(ev2)=>{ev2.stopPropagation();TY.nav(1);};
      nav.append(prevB,cnt,nextB);ft.appendChild(nav);
    }
    return true;
  },
  nav(dir){
    const ni=curPopIdx+dir;
    if(ni<0||ni>=displayedIssues.length) return;
    TY.render(ni);
  },
  fix(idx,sug){
    const iss=displayedIssues[idx];if(!iss)return;
    snapshotUndo();
    setEditorText(curText.slice(0,iss.start)+sug+curText.slice(iss.end));
    closePop();run();
  },
  ign(word,type){snapshotUndo();ignored.add((type||'')+'|'+tl(word));closePop();run();}
};
let curPopIdx=-1;

let lastFocused=null;
function closePop(){
  document.getElementById('pop').style.display='none';
  if(lastFocused&&lastFocused.focus){lastFocused.focus();}
  lastFocused=null;
}
document.getElementById('pc').addEventListener('keydown',e=>{
  if(e.key==='Enter'||e.key===' '){e.preventDefault();closePop();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('pop').style.display!=='none') closePop();
  if(document.getElementById('pop').style.display!=='none'){
    if(e.key==='ArrowRight'){e.preventDefault();TY.nav(1);}
    else if(e.key==='ArrowLeft'){e.preventDefault();TY.nav(-1);}
  }
});

function run(){
  curText=document.getElementById('inp').value;
  if(!curText.trim()){
    ['statsBar','res'].forEach(id=>document.getElementById(id).style.display='none');
    curIssues=[];displayedIssues=[];closePop();return;
  }
  curIssues=analyze(curText).filter(i=>!ignored.has(i.type+'|'+tl(i.word)));
  document.getElementById('cSp').textContent=curIssues.filter(i=>i.type==='spell').length;
  document.getElementById('cGr').textContent=curIssues.filter(i=>i.type==='gram').length;
  document.getElementById('cWn').textContent=curIssues.filter(i=>i.type==='warn').length;
  document.getElementById('cPu').textContent=curIssues.filter(i=>i.type==='punct').length;
  document.getElementById('cSu').textContent=curIssues.filter(i=>i.type==='suggest').length;
  document.getElementById('cTo').textContent=curIssues.length;
  document.getElementById('statsBar').style.display='block';
  // Bir kategoride otomatik düzeltilebilecek (tek öneriye sahip) hiç sorun yoksa,
  // o kategorinin "Düzelt" butonu artık pasif — tıklayınca sessizce hiçbir şey
  // olmaması yerine, buton zaten tıklanamaz görünüyor.
  const fixable=t=>curIssues.some(i=>i.type===t&&i.suggestions.length===1);
  document.getElementById('fxSp').disabled=!fixable('spell');
  document.getElementById('fxGr').disabled=!fixable('gram');
  document.getElementById('fxPu').disabled=!fixable('punct');
  document.getElementById('fxAll').disabled=!['spell','gram','punct','suggest'].some(fixable);
  document.getElementById('fxWarn').disabled=!curIssues.some(i=>i.type==='warn'&&i.guess);
  renderCurrent();
}

// Sadece görünümü (filtreye göre) yeniden çizer; metni tekrar analiz etmez.
// Filtre değiştiğinde run()'ı (ve dolayısıyla analyze()'i) tekrar çağırmaya gerek yok.
function renderCurrent(){
  displayedIssues=activeFilter?curIssues.filter(i=>i.type===activeFilter):curIssues;
  const ra=document.getElementById('res');ra.style.display='block';ra.innerHTML=renderRes(displayedIssues,!!activeFilter);
}

// İstatistik rozetlerine tıklayınca sadece o türdeki hataları gösteren filtre.
// Aynı rozete tekrar tıklamak veya "toplam"a tıklamak filtreyi kaldırır.
function setFilter(t){
  activeFilter=(t===''||activeFilter===t)?null:t;
  document.querySelectorAll('#statsBar .st[data-type]').forEach(el=>{
    el.classList.toggle('active',activeFilter?el.dataset.type===activeFilter:el.dataset.type==='');
  });
  if(document.getElementById('res').style.display!=='none') renderCurrent();
}
document.querySelectorAll('#statsBar .st[data-type]').forEach(el=>{
  el.addEventListener('click',()=>setFilter(el.dataset.type));
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setFilter(el.dataset.type);}});
});

function fixByType(types){
  snapshotUndo();
  let t=curText;
  // NOT: Tek geçiş yeterli değildi — bir hatayı düzeltmek bazen (ör. boşluk/uzunluk
  // değişimiyle) YENİ bir hatayı ortaya çıkarabiliyordu, bu da kullanıcının aynı
  // butona birkaç kez basmasını gerektiriyordu. Artık her turda metni yeniden
  // analiz edip, düzeltilecek bir şey kalmayana kadar (veya güvenlik sınırına
  // ulaşana kadar) otomatik olarak tekrarlıyoruz.
  for(let pass=0;pass<8;pass++){
    const issues=analyze(t).filter(i=>!ignored.has(i.type+'|'+tl(i.word)));
    const safe=issues
      .filter(i=>types.includes(i.type)&&i.type!=='warn'&&i.suggestions.length===1)
      .sort((a,b)=>b.start-a.start);
    if(!safe.length) break;
    for(const iss of safe) t=t.slice(0,iss.start)+iss.suggestions[0]+t.slice(iss.end);
  }
  // NOT: ignored.clear() ÇAĞRILMIYOR — aksi halde kullanıcının daha önce "Yoksay"
  // dediği veya "Kontrol Edin" popup'ında "olduğu gibi bırak" seçtiği kelimeler,
  // herhangi bir toplu düzelt butonuna basıldığında sessizce geri gelirdi.
  setEditorText(t);run();
}

// "Kontrol Edin" (warn) türündeki sorunlarda en olası tahmini (varsa) toplu uygular.
// Tahmin 'A' (ör. bağlaç) ise metni günceller; 'B' (ör. hâl eki, olduğu gibi doğru) ise
// o kelimeyi bir daha uyarı olarak göstermemek için yoksayılanlara ekler.
// Tahmini olmayan (belirsiz) durumlara dokunulmaz, onlar listede kalmaya devam eder.
function fixWarnByGuess(){
  snapshotUndo();
  const warns=curIssues.filter(i=>i.type==='warn'&&i.guess);
  const toFix=warns.filter(i=>i.guess.opt==='A'&&i.optA.val).sort((a,b)=>b.start-a.start);
  let t=curText;
  for(const iss of toFix) t=t.slice(0,iss.start)+iss.optA.val+t.slice(iss.end);
  for(const iss of warns.filter(i=>i.guess.opt==='B')) ignored.add('warn|'+tl(iss.word));
  setEditorText(t);run();
}

document.getElementById('chkBtn').addEventListener('click',run);
document.getElementById('clrBtn').addEventListener('click',()=>{
  snapshotUndo();
  document.getElementById('inp').value='';
  ['statsBar','res'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('cc').textContent=countLabel('');
  document.getElementById('draftNotice').style.display='none';
  curText='';curIssues=[];displayedIssues=[];ignored.clear();closePop();
  try{localStorage.removeItem('ty_draft');}catch(e){}
});
document.getElementById('inp').addEventListener('input',()=>{
  document.getElementById('cc').textContent=countLabel(document.getElementById('inp').value);
});
document.getElementById('inp').addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();run();}
});
document.getElementById('fxAll').addEventListener('click',()=>fixByType(['spell','gram','punct','suggest']));
document.getElementById('fxSp').addEventListener('click',()=>fixByType(['spell']));
document.getElementById('fxGr').addEventListener('click',()=>fixByType(['gram']));
document.getElementById('fxPu').addEventListener('click',()=>fixByType(['punct']));
document.getElementById('fxWarn').addEventListener('click',fixWarnByGuess);

const inp=document.getElementById('inp');
function autoResize(){
  this.style.height='auto';
  this.style.height=(this.scrollHeight)+'px';
}
inp.setAttribute('style','height:'+(inp.scrollHeight)+'px;overflow-y:hidden;');
inp.addEventListener('input',autoResize,false);

let autoTimer=null;
inp.addEventListener('input',()=>{
  try{localStorage.setItem('ty_draft',inp.value);}catch(e){}
  clearTimeout(autoTimer);
  autoTimer=setTimeout(run,700);
});

document.getElementById('cpyBtn').addEventListener('click',()=>{
  const val=document.getElementById('inp').value;
  const b=document.getElementById('cpyBtn');
  const showResult=ok=>{
    b.textContent=ok?'✓ Kopyalandı!':'✕ Kopyalanamadı';
    setTimeout(()=>b.textContent='⎘ Kopyala',2000);
  };
  // NOT: navigator.clipboard her ortamda mevcut değildir (HTTP gibi güvenli olmayan
  // bağlamlarda tamamen tanımsızdır) ve writeText() izin reddi gibi sebeplerle
  // reddedilebilir. Önceden bunlar hiç yakalanmıyordu — buton sessizce hiçbir şey
  // yapmıyordu. Artık her iki durumda da eski execCommand yöntemine düşüyoruz ve
  // kullanıcıya her zaman bir sonuç (başarılı/başarısız) gösteriyoruz.
  const legacyCopy=()=>{
    try{
      const ta=document.createElement('textarea');
      ta.value=val;ta.style.position='fixed';ta.style.opacity='0';
      document.body.appendChild(ta);ta.focus();ta.select();
      const ok=document.execCommand('copy');
      document.body.removeChild(ta);
      showResult(ok);
    }catch(e){showResult(false);}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(val).then(()=>showResult(true)).catch(legacyCopy);
  } else {
    legacyCopy();
  }
});
document.getElementById('pc').addEventListener('click',closePop);
document.addEventListener('click',e=>{
  const pop=document.getElementById('pop');
  if(pop.style.display==='none') return;
  if(!pop.contains(e.target)&&!e.target.closest('.h-sp,.h-gr,.h-wn,.h-pu,.h-su,.ii'))closePop();
});
document.getElementById('smpBtn').addEventListener('click',()=>{
  const val="ali'nin topu kaçtığı icin markete gitti.\n"+
    "birşey söylemek istiyorum ama bilmiyorum ,gerçekten.\n"+
    "masada ki kitabı hemde dün okudum, çünkü ki sınav vardı.\n"+
    "Türkiyede herkes bu konuyu biliyo.bu çok önemli bir konu!\n"+
    "bende para yok ama ben de bu konuya katılıyorum.";
  snapshotUndo();
  setEditorText(val);
  document.getElementById('draftNotice').style.display='none';
  run();
});
document.getElementById('undoBtn').addEventListener('click',undo);
try{
  const saved=localStorage.getItem('ty_draft');
  if(saved){
    inp.value=saved;
    document.getElementById('cc').textContent=countLabel(saved);
    autoResize.call(inp);
    run();
    document.getElementById('draftNotice').style.display='flex';
  }
}catch(e){}
document.getElementById('draftDismiss').addEventListener('click',()=>{
  document.getElementById('draftNotice').style.display='none';
});
inp.addEventListener('input',()=>{document.getElementById('draftNotice').style.display='none';},{once:true});
document.getElementById('inp').focus();
})();
</script>
