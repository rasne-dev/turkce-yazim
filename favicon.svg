<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich Crimson Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#B5202A"/>
      <stop offset="100%" stop-color="#6F0B13"/>
    </linearGradient>

    <!-- Subtle White Gloss Gradient for T -->
    <linearGradient id="tGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F3F4F6"/>
    </linearGradient>

    <!-- Nib Shading Gradient (Right Facet) -->
    <linearGradient id="facetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.06)"/>
    </linearGradient>

    <!-- Vibrant Emerald Validation Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="mainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="badgeShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  
  <!-- Outer Rim Highlight -->
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Main T & Fountain Pen Nib Shape -->
  <g filter="url(#mainShadow)">
    <!-- Seamless Unified T Body -->
    <path d="M 116,112
             C 116,101 125,92 136,92
             L 376,92
             C 387,92 396,101 396,112
             L 396,168
             C 396,179 387,188 376,188
             L 294,188
             L 294,300
             C 294,308 288,318 282,326
             L 256,386
             L 230,326
             C 224,318 218,308 218,300
             L 218,188
             L 136,188
             C 125,188 116,179 116,168
             Z"
          fill="url(#tGrad)"/>

    <!-- Right Facet Subtle Shading for 3D Nib Depth -->
    <path d="M 256,188
             L 294,188
             L 294,300
             C 294,308 288,318 282,326
             L 256,386
             Z"
          fill="url(#facetGrad)"/>

    <!-- Nib Breather Hole -->
    <circle cx="256" cy="304" r="7.5" fill="#B5202A"/>
    
    <!-- Nib Slit -->
    <line x1="256" y1="311.5" x2="256" y2="384" stroke="#B5202A" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Validation Checkmark Badge -->
  <g filter="url(#badgeShadow)">
    <circle cx="368" cy="356" r="64" fill="#FFFFFF"/>
    <circle cx="368" cy="356" r="54" fill="url(#checkGrad)"/>
    <path d="M 342,356 L 360,374 L 398,336" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>